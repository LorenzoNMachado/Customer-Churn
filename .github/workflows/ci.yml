name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Instala dependências
        run: pip install -r requirements.txt pytest
      - name: Testes
        run: pytest
      - name: Confere o pareamento do notebook
        run: jupytext --test --to py:percent notebooks/analise_churn.ipynb
      - name: Baixa e verifica o dataset original
        id: dataset
        shell: bash
        run: |
          if python scripts/download_dataset.py; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [ "$result" -eq 3 ]; then
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Kaggle download is unavailable. The notebook run is skipped. Download the CSV manually to reproduce it locally."
            else
              exit "$result"
            fi
          fi
      - name: Executa o notebook do início ao fim
        if: steps.dataset.outputs.available == 'true'
        run: jupyter nbconvert --to notebook --execute notebooks/analise_churn.ipynb --output-dir /tmp/nb
